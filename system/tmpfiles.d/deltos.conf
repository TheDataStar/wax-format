# DeltOS directories (docs/box-radio-and-boot.md §3; contract §10).
#
# All DeltOS state lives under /var/lib/deltos (Track E §4). The network
# registry holds the Wi-Fi password, so its directory is root's alone.
d /var/lib/deltos                 0755 root root -
d /var/lib/deltos/packs           0755 root root -
# Each pack's own writable storage (contract §10), one folder per pack made
# by shelld at install, owned by deltd, removed with the pack.
d /var/lib/deltos/packs-data      0755 root root -
d /var/lib/deltos/network         0700 root root -
#
# The register of people (contract §10): its owner's alone. Holds password
# hashes and the sign-in card key; never readable by deltd.
d /var/lib/deltos/identity        0700 deltos-identity deltos-identity -
#
# The box's certificate authority (docs/box-certificates.md): its private
# key is root's alone and never leaves this directory.
d /var/lib/deltos/ca              0700 root root -
#
# The box's two server certificates and keys (contract §8) and the CA's
# public certificate, readable by deltd only. Written by deltos-tls.service.
d /var/lib/deltos/tls             0750 root deltos-deltd -
#
# Settings generated from the registry at every boot (deltos-net-render).
# Never kept: they are rebuilt from the registry, so a rollback or a crash
# can never leave stale ones. setgid deltos-dns, so every generated file is
# readable by dnsmasq; hostapd.conf alone is written 0600 (root only).
# Leases are personal data (box-network-plan §4): kept only until shutdown,
# and never in a backup.
d /run/deltos                     0755 root root -
d /run/deltos/network             2750 root deltos-dns -
f /run/deltos/network/leases      0640 deltos-dns deltos-dns -
#
# identityd's socket. setgid deltos-identc, so the socket it creates there
# (mode 0660) belongs to that group, whose only member is deltd.
d /run/deltos/identity            2750 deltos-identity deltos-identc -
#
# deltos-shelld's socket (docs/shelld.md §2). setgid deltos-shellc, so the
# socket it creates there (mode 0660) belongs to that group, whose only
# member is deltd (privilege boundary rule 1).
d /run/deltos/shelld              2750 root deltos-shellc -
#
# The action log (privilege boundary rule 12; path decided 2026-11-23,
# contract §10). Only shelld writes it; read through shelld with admin.console.
d /var/lib/deltos/shelld          0750 root root -
#
# Removable drives are mounted in here, one folder each (docs/shelld.md §6).
d /run/deltos/drives              0755 root root -
#
# Add-ons (docs/base-addons-admin.md §7): each one's data and the register
# of installed add-ons; the unpacked bundles under /usr/lib/deltos/apps.
d /var/lib/deltos/apps            0755 root root -
d /usr/lib/deltos/apps            0755 root root -
