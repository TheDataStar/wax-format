# DeltOS system users (docs/box-radio-and-boot.md §3, docs/privilege-boundary.md §3).
# Each service runs as its own user with no login and no home.
#
# deltos-deltd   the box API and pack server. Unprivileged: it can change
#                nothing on the box by itself (privilege boundary §3).
# deltos-shellc  the group allowed to open deltos-shelld's socket. deltd is
#                its only member (privilege boundary rule 1). deltos-shelld
#                itself is not built yet; the group exists now so the rule
#                holds from the first box.
# deltos-dns     dnsmasq: the box's DNS and the hotspot's DHCP.
# deltos-identity  deltos-identityd: the register of people and sign-ins
#                (docs/identityd.md). No powers, no network.
# deltos-identc  the group allowed to open identityd's socket. deltd is its
#                only member; identityd checks the caller's user again.
u deltos-deltd  - "DeltOS box API and pack server" - -
g deltos-shellc -
m deltos-deltd  deltos-shellc
u deltos-dns    - "DeltOS names and addresses (dnsmasq)" - -
u deltos-identity - "DeltOS people and sign-in" - -
g deltos-identc -
m deltos-deltd  deltos-identc
