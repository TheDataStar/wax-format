[package]
name = "deltos-tls"
version = "0.1.0"
edition = "2021"
description = "The box's own certificate authority: makes and renews the two wildcard certificates deltd serves HTTPS with (docs/box-certificates.md)"
license = "MIT"

[[bin]]
name = "deltos-tls-provision"
path = "src/bin/provision.rs"

[dependencies]
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
time = "0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tempfile = "3.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
