[package]
name = "deltos-net"
version = "0.1.0"
edition = "2021"
description = "E10: the box's name and address registry, and the dnsmasq/nftables settings generated from it (docs/box-network-plan.md)"
license = "MIT"

[[bin]]
name = "deltos-net-render"
path = "src/bin/render.rs"

[dependencies]
rusqlite = { version = "0.30", features = ["bundled"] }
thiserror = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.8"
