[package]
name = "delt-desktop-app"
version = "0.1.0"
edition = "2021"
description = "Delt for the desktop: the window (Tauri) around delt-desktop"
license = "MIT"
# Kept out of the workspace (see the root Cargo.toml): building it needs the
# platform web view (WebView2 / WKWebView / WebKitGTK), which the format,
# the box and CI otherwise never need.

[[bin]]
name = "delt"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
delt-desktop = { path = "../delt-desktop" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
