[package]
name = "deltlib"
version = "0.1.0"
edition = "2021"
description = "Delt library: the pack library, cross-pack search and the deltd pack server (docs/deltd-api-v1.md)"
license = "MIT"

[[bin]]
name = "deltd"
path = "src/bin/deltd.rs"

[dependencies]
wax-core = { path = "../wax-core" }
deltos-net = { path = "../deltos-net" }
deltos-identity = { path = "../deltos-identity" }
rusqlite = { version = "0.30", features = ["bundled"] }
sha2 = "0.10"
caseless = "0.2"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-stream = "0.1"
percent-encoding = "2"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio", "service"] }
tower = { version = "0.4", features = ["util"] }

[dev-dependencies]
rcgen = "0.13"
libc = "0.2"
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "macros"] }
http-body-util = "0.1"
tempfile = "3.8"
zstd = "0.13"
