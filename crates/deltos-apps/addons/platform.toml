schema = 1
id = "platform"
name = "App platform"
version = "0.1.0"
kind = "addon"
summary = "Runs add-on apps in their own containers and gives each one its address under deltos.lan."
licence = "Apache-2.0"
upstream = "Docker Engine + Compose (G1), reverse proxy (G2)"
min_profile = "classroom"

[resources]
evidence = "provisional"
min_ram_bytes = 805306368       # 768 MiB, contract §6 "G1 + G2"
min_storage_bytes = 8589934592  # 8 GiB, contract §6 "G1 + G2"
arch = "any"
basis = "Contract §6 provisional row 'G1 + G2 (orchestrator, proxy)': a number to argue with, not a measurement."

[run]
# The orchestrator itself: a systemd unit, the one add-on allowed to be one.
# Docker's engine runs as root; how far that is acceptable is open (§10).
form = "systemd"
entry = "deltos-platform.service"
listens = [{ port = 8443, proto = "tcp", bind = "loopback" }]

[sign_in]
method = "none"

[health]
probe = "systemd"
target = "deltos-platform.service"

[backup]
paths = ["/var/lib/deltos/apps/platform/config/"]
exclude = ["/var/lib/deltos/apps/platform/images/"]
