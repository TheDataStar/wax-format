[package]
name = "deltos-identity"
version = "0.1.0"
edition = "2021"
description = "deltos-identityd: people, roles, sessions, sign-in cards, remembered devices and re-confirmation tickets (docs/identityd.md)"
license = "MIT"

[[bin]]
name = "deltos-identityd"
path = "src/bin/identityd.rs"

[[bin]]
name = "deltos-identity-provision"
path = "src/bin/provision.rs"

[dependencies]
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
getrandom = "0.2"
libc = "0.2"
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }

[dev-dependencies]
tempfile = "3.8"
