[package]
name = "wax-builder"
version = "1.2.0"
edition = "2021"
description = "CLI that assembles a directory tree into a signed .wax archive (component A2)"
license = "MIT"

[dependencies]
wax-core = { path = "../wax-core" }
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.4"
anyhow = "1.0"
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
language-tags = "0.3"
sha2 = "0.10"
tempfile = "3.8"

[dev-dependencies]
tempfile = "3.8"
wax-core = { path = "../wax-core" }
sha2 = "0.10"
