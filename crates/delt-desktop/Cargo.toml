[package]
name = "delt-desktop"
version = "0.1.0"
edition = "2021"
description = "Delt desktop: the core of the Delt desktop reader (local packs, reading, search, bookmarks, private notes, themes, edition updates), built on deltlib"
license = "MIT"

[dependencies]
deltlib = { path = "../deltlib" }
wax-core = { path = "../wax-core" }
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
thiserror = "1.0"
getrandom = "0.3"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3.8"
